name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: room-reservation-app/server
        working-directory: room-reservation-app/server
        run: |
          npm ci
          npm test
      - name: room-reservation-app/client
        working-directory: room-reservation-app/client
        run: |
          npm ci
          npm test
